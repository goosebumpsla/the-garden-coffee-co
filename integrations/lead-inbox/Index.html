<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#173f3a">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173f3a'/%3E%3Cpath d='M16 20h30v17c0 9-7 15-15 15s-15-6-15-15V20Zm30 5h3c6 0 9 4 9 9s-4 9-10 9h-4' fill='none' stroke='%23f7f0df' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M24 14c0-4 4-5 4-9M36 14c0-4 4-5 4-9' stroke='%23d98258' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>Garden &amp; Coffee Lead Inbox</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16201f;
        --muted: #65716e;
        --line: #dfe5e1;
        --paper: #fffdf7;
        --canvas: #f3f1e9;
        --green: #173f3a;
        --green-2: #225b53;
        --cream: #f7f0df;
        --orange: #d98258;
        --red: #b83f35;
        --gold: #a26713;
        --shadow: 0 18px 48px rgba(31, 53, 48, .09);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 16px; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .shell { min-height: 100vh; }
      .topbar { background: var(--green); color: white; padding: 24px clamp(18px, 4vw, 52px) 28px; }
      .topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--cream); color: var(--green); font-weight: 900; letter-spacing: -.06em; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.45rem, 3vw, 2rem); font-weight: 600; }
      .refresh { color: white; background: transparent; border: 1px solid rgba(255,255,255,.34); border-radius: 999px; min-height: 42px; padding: 8px 15px; }
      .refresh:hover, .refresh:focus-visible { background: rgba(255,255,255,.1); }
      .summary { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-top: 24px; }
      .stat { border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.07); border-radius: 16px; padding: 14px 16px; }
      .stat strong { display: block; font-size: 1.7rem; line-height: 1; }
      .stat span { display: block; margin-top: 7px; color: rgba(255,255,255,.76); font-size: .86rem; }
      main { width: min(1280px, calc(100% - 32px)); margin: 0 auto; padding: 26px 0 56px; }
      .controls { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .search { width: min(430px,100%); min-height: 46px; border: 1px solid var(--line); border-radius: 14px; background: white; padding: 0 15px; color: var(--ink); box-shadow: 0 8px 24px rgba(31,53,48,.04); }
      .updated { color: var(--muted); font-size: .88rem; }
      .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: thin; }
      .tab { flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,.72); color: var(--ink); border-radius: 999px; min-height: 42px; padding: 9px 14px; font-weight: 700; }
      .tab span { display: inline-grid; place-items: center; min-width: 24px; height: 24px; margin-left: 7px; border-radius: 999px; background: #e5eae7; font-size: .78rem; }
      .tab[aria-selected="true"] { color: white; background: var(--green); border-color: var(--green); }
      .tab[aria-selected="true"] span { background: rgba(255,255,255,.18); }
      .list-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 14px 2px; }
      .list-head h2 { margin: 0; font-size: 1.15rem; }
      .list-head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
      .lead-list { display: grid; gap: 12px; }
      .lead { display: grid; grid-template-columns: minmax(220px,1.05fr) minmax(210px,.8fr) minmax(230px,1fr) auto; align-items: center; gap: 18px; background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--green); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
      .lead[data-queue="new"] { border-left-color: var(--orange); }
      .lead[data-queue="followup"] { border-left-color: var(--red); }
      .lead[data-queue="good"] { border-left-color: #247764; }
      .lead[data-queue="quote"] { border-left-color: var(--gold); }
      .identity { min-width: 0; }
      .lead-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .lead-title h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; font-size: 1.08rem; }
      .lead-id { flex: 0 0 auto; color: var(--muted); font-size: .74rem; font-weight: 800; letter-spacing: .04em; }
      .contact { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 8px; }
      .contact a { color: var(--green-2); font-size: .88rem; text-decoration: none; }
      .contact a:hover { text-decoration: underline; }
      .meta { display: grid; gap: 5px; color: var(--muted); font-size: .86rem; }
      .meta strong { color: var(--ink); font-weight: 750; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
      .chip { border-radius: 999px; padding: 5px 9px; background: #e7ece8; color: #34423f; font-size: .74rem; font-weight: 800; }
      .chip.paid { background: #e6f2ef; color: #176454; }
      .chip.alert { background: #fae6e3; color: var(--red); }
      .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 7px; max-width: 315px; }
      .action { min-height: 38px; border-radius: 11px; border: 1px solid var(--line); background: white; color: var(--ink); padding: 7px 10px; font-size: .8rem; font-weight: 800; }
      .action:hover, .action:focus-visible { border-color: var(--green); color: var(--green); }
      .action.primary { background: var(--green); border-color: var(--green); color: white; }
      .action.danger { color: var(--red); }
      .follow-date { width: 142px; min-height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: white; font-size: .8rem; }
      .empty, .loading { border: 1px dashed #c5cfca; background: rgba(255,255,255,.55); border-radius: 18px; padding: 44px 20px; text-align: center; color: var(--muted); }
      .empty strong { display: block; color: var(--ink); margin-bottom: 5px; }
      .toast { position: fixed; right: 20px; bottom: 20px; z-index: 10; max-width: 360px; border-radius: 14px; padding: 13px 16px; background: var(--green); color: white; box-shadow: 0 18px 40px rgba(0,0,0,.18); transform: translateY(130%); transition: transform .2s ease; }
      .toast.show { transform: translateY(0); }
      .toast.error { background: var(--red); }
      [hidden] { display: none !important; }
      :focus-visible { outline: 3px solid rgba(217,130,88,.45); outline-offset: 2px; }
      @media (max-width: 960px) {
        .lead { grid-template-columns: 1fr 1fr; }
        .actions { justify-content: flex-start; max-width: none; grid-column: 1 / -1; padding-top: 4px; border-top: 1px solid var(--line); }
      }
      @media (max-width: 640px) {
        .topbar { padding: 18px 16px 22px; }
        .summary { grid-template-columns: repeat(2,minmax(0,1fr)); }
        main { width: min(100% - 20px, 1280px); padding-top: 18px; }
        .controls { align-items: stretch; flex-direction: column; }
        .updated { padding-left: 2px; }
        .lead { grid-template-columns: 1fr; gap: 13px; padding: 15px; }
        .actions { grid-column: auto; }
        .follow-date { flex: 1 1 150px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topline">
          <div class="brand"><div class="mark" aria-hidden="true">G&amp;C</div><h1>Lead inbox</h1></div>
          <button class="refresh" id="refreshButton" type="button">Refresh</button>
        </div>
        <div class="summary" aria-label="Lead summary">
          <div class="stat"><strong id="totalCount">—</strong><span>Total leads</span></div>
          <div class="stat"><strong id="newCount">—</strong><span>New inquiries</span></div>
          <div class="stat"><strong id="followupCount">—</strong><span>Follow-ups due</span></div>
          <div class="stat"><strong id="goodCount">—</strong><span>Good responses</span></div>
          <div class="stat"><strong id="quoteCount">—</strong><span>Quotes pending</span></div>
        </div>
      </header>

      <main>
        <div class="controls">
          <input class="search" id="searchInput" type="search" autocomplete="off" placeholder="Search name, email, phone or event…" aria-label="Search leads">
          <div class="updated" id="updatedText">Loading tracker…</div>
        </div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Lead queues"></div>
        <div class="list-head">
          <div><h2 id="queueTitle">New inquiries</h2><p id="queueDescription">People who still need a first response.</p></div>
        </div>
        <div class="lead-list" id="leadList"><div class="loading">Loading leads…</div></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const QUEUES = [
        { id: 'new', label: 'New', title: 'New inquiries', description: 'People who still need a first response.' },
        { id: 'followup', label: 'Follow-up', title: 'Follow-ups due', description: 'Leads that need attention today or are overdue.' },
        { id: 'responded', label: 'Responded', title: 'Responded', description: 'You replied and are waiting for the next step.' },
        { id: 'good', label: 'Good responses', title: 'Good responses', description: 'Interested leads with positive replies.' },
        { id: 'quote', label: 'Quote sent', title: 'Quotes pending', description: 'Quotes sent and waiting for a decision.' },
        { id: 'booked', label: 'Booked', title: 'Booked', description: 'Confirmed consultations and clients.' },
        { id: 'closed', label: 'Closed', title: 'Closed', description: 'Lost or not-a-fit leads kept for reference.' },
      ];
      let state = { leads: [], queue: 'new', query: '', saving: false };

      const $ = id => document.getElementById(id);
      $('refreshButton').addEventListener('click', loadData);
      $('searchInput').addEventListener('input', event => { state.query = event.target.value.trim().toLowerCase(); render(); });

      async function loadData() {
        $('refreshButton').disabled = true;
        $('updatedText').textContent = 'Refreshing…';
        try {
          const response = await fetch('/api/ops/leads', { credentials: 'same-origin', cache: 'no-store' });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'Could not load the tracker.');
          state.leads = data.leads || [];
          state.saving = false;
          $('updatedText').textContent = 'Updated ' + data.refreshedAt;
          render();
        } catch (error) {
          $('updatedText').textContent = 'Could not refresh';
          showToast(error && error.message ? error.message : 'Could not load the tracker.', true);
        } finally {
          $('refreshButton').disabled = false;
        }
      }

      function render() {
        renderSummary();
        renderTabs();
        const queue = QUEUES.find(item => item.id === state.queue) || QUEUES[0];
        $('queueTitle').textContent = queue.title;
        $('queueDescription').textContent = queue.description;

        const filtered = state.leads.filter(lead => {
          if (lead.queue !== state.queue) return false;
          if (!state.query) return true;
          return [lead.name, lead.email, lead.phone, lead.eventType, lead.location, lead.id, lead.campaign]
            .join(' ').toLowerCase().includes(state.query);
        });
        renderLeads(filtered);
      }

      function renderSummary() {
        const count = queue => state.leads.filter(lead => lead.queue === queue).length;
        $('totalCount').textContent = state.leads.length;
        $('newCount').textContent = count('new');
        $('followupCount').textContent = count('followup');
        $('goodCount').textContent = count('good');
        $('quoteCount').textContent = count('quote');
      }

      function renderTabs() {
        const tabs = $('tabs');
        tabs.textContent = '';
        QUEUES.forEach(queue => {
          const button = el('button', 'tab');
          button.type = 'button';
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-selected', String(state.queue === queue.id));
          button.append(document.createTextNode(queue.label));
          const count = el('span');
          count.textContent = state.leads.filter(lead => lead.queue === queue.id).length;
          button.append(count);
          button.addEventListener('click', () => { state.queue = queue.id; render(); });
          tabs.append(button);
        });
      }

      function renderLeads(leads) {
        const list = $('leadList');
        list.textContent = '';
        if (!leads.length) {
          const empty = el('div', 'empty');
          const strong = el('strong');
          strong.textContent = state.query ? 'No matching leads' : 'This queue is clear';
          empty.append(strong, document.createTextNode(state.query ? 'Try another search.' : 'Nothing needs attention here right now.'));
          list.append(empty);
          return;
        }
        leads.forEach(lead => list.append(leadCard(lead)));
      }

      function leadCard(lead) {
        const card = el('article', 'lead');
        card.dataset.queue = lead.queue;

        const identity = el('div', 'identity');
        const title = el('div', 'lead-title');
        const name = el('h3'); name.textContent = lead.name;
        const id = el('span', 'lead-id'); id.textContent = lead.id;
        title.append(name, id);
        const contact = el('div', 'contact');
        if (lead.email) contact.append(link('Email', 'mailto:' + lead.email), link('Gmail', gmailSearch(lead.email)));
        if (lead.phone) contact.append(link(lead.phone, 'tel:' + lead.phone.replace(/[^+\d]/g, '')));
        identity.append(title, contact);

        const event = el('div', 'meta');
        event.append(line('Event', [lead.eventType, lead.eventDate].filter(Boolean).join(' · ') || 'Not specified'));
        event.append(line('Details', [lead.guests && lead.guests + ' guests', lead.location].filter(Boolean).join(' · ') || '—'));
        event.append(line('Received', lead.received || '—'));

        const status = el('div', 'meta');
        status.append(line('Status', lead.stage || 'New'));
        status.append(line('Owner', lead.owner || 'Unassigned'));
        status.append(line('Next', lead.nextFollowUp || lead.nextAction || 'Not set'));
        const chips = el('div', 'chips');
        chips.append(chip(lead.channel || lead.source || 'Unknown source', lead.channel === 'Paid Meta' ? 'paid' : ''));
        if (lead.followUpStatus === 'Overdue' || lead.followUpStatus === 'Due today') chips.append(chip(lead.followUpStatus, 'alert'));
        if (lead.campaign) chips.append(chip(lead.campaign));
        status.append(chips);

        const actions = el('div', 'actions');
        actions.append(actionButton('Contacted', 'contacted', lead.id, 'primary'));
        actions.append(actionButton('Good response', 'good-response', lead.id));
        actions.append(actionButton('Quote sent', 'quote-sent', lead.id));
        actions.append(actionButton('Booked', 'booked', lead.id));
        const date = el('input', 'follow-date');
        date.type = 'date'; date.value = lead.nextFollowUpISO || ''; date.setAttribute('aria-label', 'Follow-up date for ' + lead.name);
        const dateButton = el('button', 'action');
        dateButton.type = 'button'; dateButton.textContent = 'Set follow-up';
        dateButton.addEventListener('click', () => date.value ? save(lead.id, { type: 'follow-up', date: date.value }) : showToast('Choose a follow-up date first.', true));
        actions.append(date, dateButton, actionButton('Close', 'closed', lead.id, 'danger'));

        card.append(identity, event, status, actions);
        return card;
      }

      function actionButton(label, type, id, extraClass) {
        const button = el('button', 'action' + (extraClass ? ' ' + extraClass : ''));
        button.type = 'button'; button.textContent = label;
        button.addEventListener('click', () => {
          if (type === 'closed' && !window.confirm('Move this lead to Closed?')) return;
          save(id, { type });
        });
        return button;
      }

      async function save(id, action) {
        if (state.saving) return;
        state.saving = true;
        showToast('Saving…');
        document.querySelectorAll('button').forEach(button => button.disabled = true);
        try {
          const response = await fetch('/api/ops/update', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ leadId: id, action }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'Could not save the update.');
          state.leads = data.leads || [];
          $('updatedText').textContent = 'Updated ' + data.refreshedAt;
          showToast('Lead updated.');
          render();
        } catch (error) {
          showToast(error && error.message ? error.message : 'Could not save the update.', true);
        } finally {
          state.saving = false;
          document.querySelectorAll('button').forEach(button => button.disabled = false);
        }
      }

      function el(tag, className) { const node = document.createElement(tag); if (className) node.className = className; return node; }
      function line(label, value) { const node = el('div'); const strong = el('strong'); strong.textContent = label + ': '; node.append(strong, document.createTextNode(value)); return node; }
      function chip(value, extraClass) { const node = el('span', 'chip' + (extraClass ? ' ' + extraClass : '')); node.textContent = value; return node; }
      function link(label, href) { const node = el('a'); node.textContent = label; node.href = href; if (href.startsWith('http')) { node.target = '_blank'; node.rel = 'noopener'; } return node; }
      function gmailSearch(email) { return 'https://mail.google.com/mail/u/0/#search/' + encodeURIComponent('{from:(' + email + ') to:(' + email + ')}'); }
      function showToast(message, error) { const toast = $('toast'); toast.textContent = message; toast.classList.toggle('error', Boolean(error)); toast.classList.add('show'); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600); }

      loadData();
    </script>
  </body>
</html>
